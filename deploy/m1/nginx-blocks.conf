# For /home/user/docker/knnginx/nginx.conf, inside http { }.
# Start knsmartfritz first: nginx refuses to start when an upstream's name does not resolve.

    upstream knsmartfritz-default {
        zone knsmartfritz-default 64k;
        server knsmartfritz:8080;
        keepalive 2;
    }

    ### knsmartfritz
    server {
        listen 443 ssl;
        server_name grow.m1.kiwi;

        ssl_certificate /etc/nginx/fullchain.pem;
        ssl_certificate_key /etc/nginx/privkey.pem;

        client_max_body_size 64k;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://knsmartfritz-default;
        }
    }

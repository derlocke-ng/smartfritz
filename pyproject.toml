[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartfritz"
version = "0.2.0"
description = "Light schedules and grow history for plugs on a FRITZ!Box"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.scripts]
smartfritz = "smartfritz.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartfritz = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
